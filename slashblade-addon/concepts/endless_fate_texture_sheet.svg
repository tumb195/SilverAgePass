<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">无尽命途 — 平面贴图设计稿</title>
  <desc id="desc">不含模型轮廓的材质贴图样板：夜空刀身、冷色刃纹、常规缠柄和金色衔尾蛇无穷纹。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#171c2a"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#26375b"/><stop offset=".28" stop-color="#101a32"/><stop offset=".7" stop-color="#11172b"/><stop offset="1" stop-color="#26395d"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b8cee9"/><stop offset=".45" stop-color="#ecf2fb"/><stop offset=".55" stop-color="#829bbd"/><stop offset="1" stop-color="#d8e5f5"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b7"/><stop offset=".32" stop-color="#b1813c"/><stop offset=".62" stop-color="#e8ca7d"/><stop offset="1" stop-color="#8b602f"/></linearGradient>
    <pattern id="wrap" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="32" height="32" fill="#151521"/><path d="M0 0H32M0 16H32" stroke="#7e4269" stroke-width="8"/><path d="M0 0H32M0 16H32" stroke="#dfb5cb" stroke-opacity=".48" stroke-width="1.5"/></pattern>
    <pattern id="silk" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 0L12 12M12 0L0 12" stroke="#f2d895" stroke-opacity=".14" stroke-width="1"/></pattern>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="900" rx="28" fill="url(#paper)"/>
  <text x="60" y="64" fill="#e5ecfa" font-size="30" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" letter-spacing="5">無盡命途 · 材质贴图稿</text>
  <text x="1140" y="62" fill="#8d9bb7" text-anchor="end" font-size="14" font-family="sans-serif" letter-spacing="3">FLAT MATERIAL SHEET / NO MODEL</text>

  <text x="60" y="112" fill="#b8c6df" font-size="17" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" letter-spacing="2">01  刀身：深靛夜空、雾状星云与非几何星点</text>
  <rect x="60" y="132" width="1080" height="300" rx="12" fill="url(#night)" stroke="#637695" stroke-width="2"/>
  <rect x="60" y="132" width="1080" height="300" rx="12" fill="url(#silk)" opacity=".45"/>
  <path d="M62 169 C220 146 300 184 432 161 S682 149 826 177 S1012 154 1138 166" fill="none" stroke="#738bba" stroke-opacity=".25" stroke-width="36"/>
  <path d="M62 301 C207 278 305 321 439 292 S678 280 823 312 S1017 285 1138 300" fill="none" stroke="#654c8e" stroke-opacity=".25" stroke-width="54"/>
  <path d="M62 398 C229 374 330 405 471 388 S718 377 856 399 S1030 382 1138 394" fill="none" stroke="url(#edge)" stroke-width="12" opacity=".9"/>
  <path d="M62 405 C215 383 329 418 468 398 S720 389 853 410 S1020 395 1138 405" fill="none" stroke="#f3f6ff" stroke-opacity=".72" stroke-width="2"/>
  <path d="M62 379 C204 355 290 382 435 366 S686 355 832 379 S1012 360 1138 375" fill="none" stroke="#91a9d3" stroke-opacity=".38" stroke-width="3"/>
  <g fill="#dceaff" filter="url(#bloom)">
    <circle cx="117" cy="205" r="3.5"/><circle cx="186" cy="260" r="2"/><circle cx="253" cy="177" r="2.8"/><circle cx="320" cy="337" r="2.2"/><circle cx="390" cy="226" r="3.7"/><circle cx="464" cy="283" r="2"/><circle cx="529" cy="190" r="2.6"/><circle cx="587" cy="345" r="3.2"/><circle cx="655" cy="238" r="2.2"/><circle cx="722" cy="176" r="3.4"/><circle cx="788" cy="318" r="2"/><circle cx="842" cy="220" r="3.2"/><circle cx="908" cy="358" r="2.6"/><circle cx="966" cy="188" r="2"/><circle cx="1024" cy="272" r="3.6"/><circle cx="1082" cy="219" r="2.2"/>
  </g>
  <g fill="#aebeff" opacity=".85"><circle cx="151" cy="332" r="1.4"/><circle cx="289" cy="237" r="1.3"/><circle cx="356" cy="189" r="1.5"/><circle cx="500" cy="350" r="1.4"/><circle cx="619" cy="184" r="1.6"/><circle cx="690" cy="300" r="1.4"/><circle cx="758" cy="224" r="1.5"/><circle cx="880" cy="167" r="1.4"/><circle cx="1000" cy="337" r="1.6"/><circle cx="1110" cy="322" r="1.4"/></g>
  <text x="82" y="424" fill="#8194b5" font-size="13" font-family="sans-serif" letter-spacing="2">HAMON / COLD SILVER EDGE</text>

  <text x="60" y="484" fill="#b8c6df" font-size="17" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" letter-spacing="2">02  刀柄：深色底、紫红缠绳，保留常规柄纹</text>
  <rect x="60" y="505" width="660" height="155" rx="10" fill="url(#wrap)" stroke="#87718d" stroke-width="2"/>
  <path d="M60 535H720M60 630H720" stroke="url(#gold)" stroke-width="9" opacity=".9"/>
  <text x="82" y="646" fill="#c4afce" font-size="12" font-family="sans-serif" letter-spacing="2">DARK TSUKA / PLUM ITO</text>

  <text x="780" y="484" fill="#b8c6df" font-size="17" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" letter-spacing="2">03  护手装饰：衔尾蛇无穷纹</text>
  <rect x="780" y="505" width="360" height="155" rx="10" fill="#202031" stroke="#9f8658" stroke-width="2"/>
  <rect x="780" y="505" width="360" height="155" rx="10" fill="url(#silk)" opacity=".35"/>
  <path d="M960 585 C923 540 866 549 867 581 C868 615 922 626 960 585 C998 544 1051 552 1054 582 C1057 615 1001 625 960 585" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
  <g fill="url(#gold)" stroke="#fff0bb" stroke-width="2"><ellipse cx="869" cy="581" rx="12" ry="9"/><ellipse cx="1053" cy="582" rx="12" ry="9"/></g>
  <g fill="#342744"><circle cx="872" cy="579" r="1.7"/><circle cx="1055" cy="580" r="1.7"/></g>
  <path d="M860 581L846 571L850 589ZM1062 582L1077 572L1073 590Z" fill="url(#gold)"/>
  <text x="800" y="646" fill="#c6ad76" font-size="12" font-family="sans-serif" letter-spacing="2">GOLDEN FITTING / OUROBOROS LOOP</text>

  <path d="M60 705H1140" stroke="#39445c" stroke-width="2"/>
  <text x="60" y="750" fill="#9eacc5" font-size="16" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">这是平面材质稿，不含刀身轮廓或模型透视。最终导入游戏时，需按所用 Resharped 刀模的 UV 岛重新排版。</text>
  <text x="60" y="785" fill="#7788a5" font-size="13" font-family="sans-serif" letter-spacing="2">COLOR NOTES: MIDNIGHT INDIGO · FROSTED STEEL · MUTED PLUM · ANTIQUE GOLD</text>
</svg>
