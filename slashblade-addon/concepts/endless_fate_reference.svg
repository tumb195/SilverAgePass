<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">无尽命途 — 参考造型版</title>
  <desc id="desc">参考斜向长曲刃造型的拔刀剑，夜空星点刀身、金色圆护手与衔尾蛇无穷结、常规黑紫缠柄。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#060812"/><stop offset=".72" stop-color="#11121c"/><stop offset="1" stop-color="#25232b"/></linearGradient>
    <radialGradient id="backGlow"><stop stop-color="#303657" stop-opacity=".48"/><stop offset="1" stop-color="#080a12" stop-opacity="0"/></radialGradient>
    <linearGradient id="blade" x1=".1" y1=".05" x2=".7" y2="1"><stop stop-color="#d8e3f4"/><stop offset=".12" stop-color="#697da4"/><stop offset=".2" stop-color="#182746"/><stop offset=".52" stop-color="#111a32"/><stop offset=".82" stop-color="#253457"/><stop offset=".94" stop-color="#d7e1f1"/><stop offset="1" stop-color="#f4f5f8"/></linearGradient>
    <linearGradient id="hamon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b5c9e6"/><stop offset=".45" stop-color="#eef5ff"/><stop offset="1" stop-color="#98acd0"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0bd"/><stop offset=".24" stop-color="#b68943"/><stop offset=".52" stop-color="#f4d98f"/><stop offset=".75" stop-color="#886131"/><stop offset="1" stop-color="#e8ce87"/></linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151321"/><stop offset=".52" stop-color="#29243b"/><stop offset="1" stop-color="#111321"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bd8cff"/><stop offset="1" stop-color="#482a77"/></linearGradient>
    <pattern id="tsukaWrap" width="34" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(41)">
      <path d="M-10 2H45M-10 25H45" stroke="#ad8bd2" stroke-width="5"/>
      <path d="M-10 2H45M-10 25H45" stroke="#f0d5fa" stroke-opacity=".56" stroke-width="1.1"/>
    </pattern>
    <clipPath id="bladeClip"><path d="M381 290 C500 365 635 475 785 566 C890 628 1000 661 1092 650 C1042 680 923 700 811 674 C625 622 486 483 352 350 Q339 328 350 306Z"/></clipPath>
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1400" height="850" rx="34" fill="url(#bg)"/>
  <ellipse cx="675" cy="435" rx="700" ry="520" fill="url(#backGlow)"/>
  <g fill="#becde8" opacity=".52"><circle cx="143" cy="188" r="2"/><circle cx="255" cy="101" r="1.5"/><circle cx="1213" cy="192" r="2"/><circle cx="1304" cy="354" r="1.7"/><circle cx="190" cy="651" r="1.5"/><circle cx="1130" cy="766" r="2"/><circle cx="935" cy="115" r="1.4"/></g>
  <text x="66" y="70" fill="#dce6f8" font-size="29" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" letter-spacing="6">無盡命途</text>
  <text x="1335" y="68" text-anchor="end" fill="#8f9bb4" font-size="16" font-family="sans-serif" letter-spacing="3">REFERENCE SILHOUETTE STUDY</text>

  <!-- Long, forward-curving blade: the tip points out and down-right, following the reference silhouette. -->
  <path d="M381 290 C500 365 635 475 785 566 C890 628 1000 661 1092 650 C1042 680 923 700 811 674 C625 622 486 483 352 350 Q339 328 350 306Z" fill="url(#blade)" stroke="#a8bad7" stroke-width="4"/>
  <g clip-path="url(#bladeClip)">
    <path d="M355 311 C514 424 659 541 821 620 C918 670 1015 680 1080 661" fill="none" stroke="url(#hamon)" stroke-width="10" opacity=".94"/>
    <path d="M366 299 C515 392 654 503 802 588 C911 646 1005 669 1080 658" fill="none" stroke="#e6edfa" stroke-opacity=".35" stroke-width="3"/>
    <path d="M375 326 C513 432 634 553 795 617" fill="none" stroke="#10172a" stroke-opacity=".72" stroke-width="8"/>
    <path d="M433 360 C473 395 466 420 505 448 C545 476 540 506 580 533 C621 560 619 589 663 613 C700 633 711 650 755 668" fill="none" stroke="#92a9d4" stroke-opacity=".32" stroke-width="7"/>
    <path d="M438 363 C480 396 475 417 510 443 C549 471 546 500 587 528 C628 556 628 582 670 607 C710 630 725 646 764 659" fill="none" stroke="#101629" stroke-opacity=".78" stroke-width="3"/>
    <g fill="#d7e7ff" filter="url(#starGlow)">
      <circle cx="430" cy="344" r="3.3"/><circle cx="467" cy="385" r="2.2"/><circle cx="495" cy="415" r="3"/><circle cx="520" cy="452" r="1.8"/><circle cx="555" cy="468" r="2.7"/><circle cx="578" cy="505" r="3.4"/><circle cx="612" cy="524" r="1.9"/><circle cx="640" cy="558" r="2.7"/><circle cx="674" cy="570" r="1.8"/><circle cx="697" cy="604" r="3.2"/><circle cx="735" cy="614" r="2.2"/><circle cx="765" cy="640" r="3.5"/><circle cx="805" cy="645" r="1.8"/><circle cx="846" cy="666" r="2.5"/><circle cx="891" cy="676" r="1.9"/><circle cx="937" cy="691" r="3"/><circle cx="987" cy="688" r="1.8"/>
    </g>
    <g fill="#a9b9ff" opacity=".9"><circle cx="452" cy="359" r="1.4"/><circle cx="482" cy="429" r="1.4"/><circle cx="538" cy="477" r="1.5"/><circle cx="598" cy="540" r="1.4"/><circle cx="658" cy="580" r="1.5"/><circle cx="719" cy="628" r="1.3"/><circle cx="786" cy="656" r="1.4"/><circle cx="872" cy="679" r="1.5"/><circle cx="958" cy="698" r="1.3"/></g>
  </g>

  <!-- Round golden guard carrying the ouroboros infinity mark. -->
  <g transform="translate(347 305) rotate(-42)">
    <ellipse cx="0" cy="0" rx="62" ry="45" fill="url(#gold)" stroke="#f6e2a8" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="50" ry="34" fill="#222238" stroke="#806038" stroke-width="3"/>
    <path d="M-2 0 C-19-20-43-15-44-1 C-44 14-19 19-2 0 C16-18 39-14 43-1 C46 14 19 19 2 0" fill="none" stroke="#e7c979" stroke-width="5" stroke-linecap="round"/>
    <g fill="#f4d989" stroke="#fff0bd" stroke-width="1"><ellipse cx="-45" cy="-1" rx="6" ry="4.5"/><ellipse cx="44" cy="-1" rx="6" ry="4.5"/></g>
    <g fill="#433158"><circle cx="-43" cy="-2" r=".9"/><circle cx="46" cy="-2" r=".9"/></g>
    <circle cx="0" cy="0" r="3" fill="#d9b76d"/>
  </g>

  <!-- Short, normal grip with dark purple ito and a restrained hanging cord. -->
  <g transform="rotate(-43 250 230)">
    <rect x="220" y="102" width="52" height="198" rx="22" fill="url(#handle)" stroke="#b39a65" stroke-width="4"/>
    <rect x="225" y="113" width="42" height="176" rx="17" fill="url(#tsukaWrap)"/>
    <path d="M225 126H267M225 277H267" stroke="url(#gold)" stroke-width="7"/>
    <path d="M220 107 Q246 93 272 107 L272 123 Q246 135 220 123Z" fill="url(#gold)" stroke="#f5e2ae" stroke-width="3"/>
    <path d="M220 286 Q246 298 272 286 L272 302 Q246 315 220 302Z" fill="url(#gold)" stroke="#f5e2ae" stroke-width="3"/>
    <circle cx="246" cy="298" r="5" fill="#211b2e"/>
  </g>
  <path d="M195 145 Q171 179 188 217" fill="none" stroke="#9e6bd3" stroke-width="5"/>
  <path d="M188 217 C181 242 174 260 178 282 Q192 306 205 282 C211 258 202 238 188 217Z" fill="url(#purple)" stroke="#c1a1e6" stroke-width="2"/>
  <path d="M188 225Q190 255 184 286M194 229Q201 257 198 284" fill="none" stroke="#e0c4ff" stroke-opacity=".55" stroke-width="2"/>

  <path d="M65 786H1335" stroke="#42475a" stroke-width="2"/>
  <text x="67" y="820" fill="#aeb9cf" font-size="17" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" letter-spacing="2">曲刃轮廓取自参考图 · 星点替代三角纹 · 金色圆护手与衔尾蛇无穷结 · 常规短柄</text>
</svg>
