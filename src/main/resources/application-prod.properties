# ==========================================
# Production Profile Configuration
# ==========================================
# This profile is used for production deployment.
# Use with: java -jar silveragepass.jar --spring.profiles.active=prod

# ==========================================
# Production HTTPS Configuration
# ==========================================

# Enable SSL (REQUIRED for production)
server.ssl.enabled=true
server.ssl.port=443

# Production keystore (CA-signed certificate)
# Use environment variables for sensitive paths and passwords
server.ssl.key-store=${SSL_KEYSTORE_PATH:file:/etc/ssl/silveragepass.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:silveragepass}

# TLS 1.3 preferred, TLS 1.2 as fallback
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# Strong cipher suites only
server.ssl.ciphers=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

# No client authentication required
server.ssl.client-auth=none

# Redirect HTTP to HTTPS (REQUIRED for production)
server.ssl.redirect-http-to-https=true

# Disable HTTP port (all traffic via HTTPS)
server.port=-1

# ==========================================
# Production Database Configuration
# ==========================================

# Use production database with SSL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/silveragepass?useSSL=true&requireSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:silveragepass}
spring.datasource.password=${DB_PASSWORD}

# Connection pool configuration
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Disable SQL logging in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Validate schema but don't auto-update
spring.jpa.hibernate.ddl-auto=validate

# ==========================================
# Production Redis Configuration
# ==========================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=0
spring.data.redis.timeout=60000

# Redis connection pool
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=-1ms

# ==========================================
# Production Logging Configuration
# ==========================================

# Production logging levels
logging.level.root=WARN
logging.level.com.learning.silveragepass=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Disable SSL debug logging in production
logging.level.javax.net.ssl=WARN

# Log to file
logging.file.name=/var/log/silveragepass/application.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==========================================
# Production CORS Configuration
# ==========================================

# Restrict CORS to specific origins
spring.webmvc.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://yourdomain.com,https://www.yourdomain.com}
spring.webmvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.webmvc.cors.allowed-headers=Authorization,Content-Type,Accept
spring.webmvc.cors.allow-credentials=true
spring.webmvc.cors.max-age=3600

# ==========================================
# Production Security Configuration
# ==========================================

# JWT configuration (use strong secrets from environment)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=1800000
app.jwt.refresh-token-expiration=604800000

# ==========================================
# Production API Keys
# ==========================================

# Use production API keys from environment variables
app.api-keys.amap.key=${AMAP_API_KEY}
app.api-keys.amap.release-key=${AMAP_RELEASE_KEY}
app.api-keys.qweather.key=${QWEATHER_API_KEY}
app.api-keys.qweather.private-key=${QWEATHER_PRIVATE_KEY}
app.api-keys.qweather.project-id=${QWEATHER_PROJECT_ID}
app.api-keys.qweather.credential-id=${QWEATHER_CREDENTIAL_ID}

# Encryption key for API keys
app.api-keys.encryption.secret-key=${API_KEY_ENCRYPTION_SECRET}

# ==========================================
# Production Spring AI Configuration
# ==========================================

# Production SiliconFlow API
spring.ai.openai.api-key=${SILICONFLOW_API_KEY}
spring.ai.openai.base-url=${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}

# ==========================================
# Production File Storage
# ==========================================

# Use production file storage location
file.storage.upload-dir=${FILE_STORAGE_PATH:/var/silveragepass/uploads}

# ==========================================
# Production OSS Configuration
# ==========================================

aliyun.oss.endpoint=${OSS_ENDPOINT}
aliyun.oss.access-key-id=${OSS_ACCESS_KEY_ID}
aliyun.oss.access-key-secret=${OSS_ACCESS_KEY_SECRET}
aliyun.oss.bucket-name=${OSS_BUCKET_NAME}

# ==========================================
# Production Message Encryption
# ==========================================

# Strong encryption key for health conversation messages
app.encryption.secret-key=${MESSAGE_ENCRYPTION_KEY}

# ==========================================
# Production Actuator Configuration
# ==========================================

# Enable health and metrics endpoints
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# ==========================================
# Production Performance Configuration
# ==========================================

# Enable HTTP/2 for better performance
server.http2.enabled=true

# Enable compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml

# ==========================================
# Production Notes
# ==========================================

# Required Environment Variables:
#   SSL_KEYSTORE_PATH         - Path to SSL certificate keystore
#   SSL_KEYSTORE_PASSWORD     - Keystore password
#   DB_URL                    - Database connection URL
#   DB_USERNAME               - Database username
#   DB_PASSWORD               - Database password
#   REDIS_PASSWORD            - Redis password
#   JWT_SECRET                - JWT signing secret
#   SILICONFLOW_API_KEY       - SiliconFlow API key
#   MESSAGE_ENCRYPTION_KEY    - Message encryption key
#   API_KEY_ENCRYPTION_SECRET - API key encryption secret
#
# Optional Environment Variables:
#   SSL_KEY_ALIAS             - Certificate alias (default: silveragepass)
#   REDIS_HOST                - Redis host (default: localhost)
#   REDIS_PORT                - Redis port (default: 6379)
#   CORS_ALLOWED_ORIGINS      - Allowed CORS origins
#   FILE_STORAGE_PATH         - File upload directory
#
# To run in production:
#   java -jar silveragepass.jar --spring.profiles.active=prod
#
# Or with systemd:
#   See TLS_HTTPS_CONFIGURATION_GUIDE.md for systemd service configuration
#
# Security Checklist:
#   ✓ Use CA-signed certificate (Let's Encrypt or commercial)
#   ✓ Set strong passwords for all secrets
#   ✓ Enable firewall (allow only 443, 80 for redirect)
#   ✓ Configure HSTS headers (via reverse proxy)
#   ✓ Enable certificate pinning in Android app
#   ✓ Set up certificate expiration monitoring
#   ✓ Configure automated certificate renewal
#   ✓ Review and test TLS configuration with SSL Labs
