# SilverAgePass 配置模板
# 复制此文件为 application.properties 并修改相应配置

spring.application.name=SilverAgePass

# 数据库配置 - 请修改为实际配置
spring.datasource.url=jdbc:mysql://localhost:3306/silveragepass?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Redis配置
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=60000

# 服务器配置
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/silveragepass

# 日志配置
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.learning.silveragepass=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson配置
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT配置 - 请使用强密钥
app.jwt.secret=${JWT_SECRET:your_very_long_and_secure_secret_key_here}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.header=Authorization
app.jwt.prefix=Bearer

# 跨域配置
spring.webmvc.cors.allowed-origins=${CORS_ORIGINS:*}
spring.webmvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.webmvc.cors.allowed-headers=*
spring.webmvc.cors.allow-credentials=true
spring.webmvc.cors.max-age=3600

# 短信服务配置（需要根据实际服务商配置）
sms.provider=${SMS_PROVIDER:mock}
sms.access-key=${SMS_ACCESS_KEY:}
sms.secret-key=${SMS_SECRET_KEY:}
sms.template-id=${SMS_TEMPLATE_ID:}

# 文件存储配置
file.upload.path=${FILE_UPLOAD_PATH:./uploads}
file.upload.max-size=10MB

# ==========================================
# 阿里云 OSS 配置（视频存储）
# ==========================================

# OSS 服务端点
aliyun.oss.endpoint=${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
# 访问密钥 ID
aliyun.oss.access-key-id=${OSS_ACCESS_KEY_ID:your-access-key-id}
# 访问密钥 Secret
aliyun.oss.access-key-secret=${OSS_ACCESS_KEY_SECRET:your-access-key-secret}
# 存储桶名称
aliyun.oss.bucket-name=${OSS_BUCKET_NAME:silveragepass-videos}

# 视频配置
# 签名 URL 过期时间（秒），默认2小时
aliyun.oss.video.signed-url-expiration-seconds=7200
# 观看历史最大条数
aliyun.oss.video.watch-history-max-entries=100
# 默认视频封面图 URL
aliyun.oss.video.default-thumbnail-url=/static/images/video-default-thumbnail.png