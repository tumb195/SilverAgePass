spring.application.name=SilverAgePass

# 数据库配置ADFFqhjkk2020!
spring.datasource.url=jdbc:mysql://localhost:3306/silveragepass?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=adffqhjkk2020
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 连接池配置（解决连接耗尽问题）
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# 使用新版MySQLDialect替代已废弃的MySQL8Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# 显式禁用open-in-view，避免在视图渲染期间执行数据库查询
spring.jpa.open-in-view=false

# Redis配置
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=60000

# 服务器配置
server.port=8080
server.servlet.context-path=/silveragepass

# ==========================================
# TLS/HTTPS 配置（用于健康数据传输安全）
# ==========================================

# HTTPS端口（生产环境使用443）
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.port=${SSL_PORT:8443}

# SSL证书配置
# 证书文件路径（PKCS12格式）
server.ssl.key-store=${SSL_KEYSTORE_PATH:classpath:keystore/silveragepass.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:silveragepass}

# TLS协议版本配置（仅使用TLS 1.3和TLS 1.2）
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# 密码套件配置（优先使用TLS 1.3强加密套件）
server.ssl.ciphers=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

# 客户端认证配置（可选，用于双向TLS）
server.ssl.client-auth=${SSL_CLIENT_AUTH:none}

# HTTP重定向到HTTPS（生产环境启用）
server.ssl.redirect-http-to-https=${SSL_REDIRECT_HTTP:false}

# 日志配置
logging.level.root=INFO
logging.level.com.learning.silveragepass=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# 文件存储配置
file.storage.upload-dir=/root/SilverAgePass/uploads
file.storage.max-file-size=10485760
file.storage.allowed-image-extensions=jpg,jpeg,png,gif,bmp,webp

# Jackson配置
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT配置
app.jwt.secret=silverAgePassSecretKeyMustBeVeryLongAndSecureToEnsureTokenSecurity
app.jwt.expiration=86400000
app.jwt.header=Authorization
app.jwt.prefix=Bearer

# 双Token认证配置
# Access Token有效期：30分钟（1800000毫秒）
app.jwt.access-token-expiration=18000000
# Refresh Token有效期：7天（604800000毫秒）
app.jwt.refresh-token-expiration=604800000

# 跨域配置
spring.webmvc.cors.allowed-origins=*
spring.webmvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.webmvc.cors.allowed-headers=*
spring.webmvc.cors.allow-credentials=true
spring.webmvc.cors.max-age=3600


