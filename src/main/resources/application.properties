# ==========================================
# 数据保留策略配置（Data Retention Policy）
# ==========================================

# 消息内容保留期限（天数），默认90天
# Message content retention period in days, default 90 days
app.data-retention.message-retention-days=${MESSAGE_RETENTION_DAYS:90}

# 数据保留策略执行时间（Cron表达式）
# 默认每天凌晨2点执行
# Data retention policy execution schedule (Cron expression)
# Default: daily at 2 AM
app.data-retention.schedule=${DATA_RETENTION_SCHEDULE:0 0 2 * * ?}

# ==========================================
# 性能监控和告警配置（Performance Monitoring & Alerting）
# ==========================================

# API响应时间阈值（毫秒）
# API response time threshold in milliseconds
# 警告阈值：超过此值记录警告日志
app.monitoring.threshold.api-response-time-warning-ms=${API_RESPONSE_TIME_WARNING:3000}
# 严重阈值：超过此值触发管理员告警
app.monitoring.threshold.api-response-time-critical-ms=${API_RESPONSE_TIME_CRITICAL:5000}

# API错误率阈值（百分比，0-100）
# API error rate threshold in percentage (0-100)
# 警告阈值：错误率超过此值记录警告
app.monitoring.threshold.api-error-rate-warning-percent=${API_ERROR_RATE_WARNING:10}
# 严重阈值：错误率超过此值触发管理员告警
app.monitoring.threshold.api-error-rate-critical-percent=${API_ERROR_RATE_CRITICAL:20}

# 异步任务队列深度阈值
# Async task queue depth threshold
# 警告阈值：队列深度超过此值记录警告
app.monitoring.threshold.queue-depth-warning=${QUEUE_DEPTH_WARNING:50}
# 严重阈值：队列深度超过此值触发管理员告警
app.monitoring.threshold.queue-depth-critical=${QUEUE_DEPTH_CRITICAL:100}

# 异步任务失败率阈值（百分比，0-100）
# Async task failure rate threshold in percentage (0-100)
# 警告阈值：失败率超过此值记录警告
app.monitoring.threshold.task-failure-rate-warning-percent=${TASK_FAILURE_RATE_WARNING:5}
# 严重阈值：失败率超过此值触发管理员告警
app.monitoring.threshold.task-failure-rate-critical-percent=${TASK_FAILURE_RATE_CRITICAL:15}

# 性能监控检查间隔（Cron表达式）
# 默认每5分钟检查一次
# Performance monitoring check interval (Cron expression)
# Default: every 5 minutes
app.monitoring.check-interval=${MONITORING_CHECK_INTERVAL:0 */5 * * * ?}

# 管理员告警通知配置
# Administrator alert notification configuration
# 告警通知邮箱（多个邮箱用逗号分隔）
app.monitoring.alert.admin-emails=${ADMIN_ALERT_EMAILS:admin@silveragepass.com}
# 告警通知电话（多个电话用逗号分隔）
app.monitoring.alert.admin-phones=${ADMIN_ALERT_PHONES:}
# 告警冷却时间（分钟）- 同一类型告警在此时间内不重复发送
app.monitoring.alert.cooldown-minutes=${ALERT_COOLDOWN_MINUTES:30}


# ==========================================
# RAG+Agent 健康助手配置 (RAG+Agent Health Assistant)
# ==========================================

# --- RAG (检索增强生成) 配置 ---
# RAG功能开关 (true=启用, false=禁用回退到基础LLM模式)
# RAG feature toggle (true=enabled, false=fallback to basic LLM mode)
app.rag-agent.rag.enabled=${RAG_ENABLED:true}

# 知识检索返回文档数量 (top-k)
# Number of top documents to retrieve from knowledge base
app.rag-agent.rag.top-k=${RAG_TOP_K:5}

# 相似度阈值 (0.0-1.0, 低于此值的文档将被过滤)
# Similarity threshold (0.0-1.0, documents below this are filtered)
# 注意：中文语义匹配分数通常偏低，建议设置为0.5以获得更好的召回率
app.rag-agent.rag.similarity-threshold=${RAG_SIMILARITY_THRESHOLD:0.5}

# 知识检索超时时间 (毫秒)
# Knowledge retrieval timeout in milliseconds
app.rag-agent.rag.retrieval-timeout-ms=${RAG_RETRIEVAL_TIMEOUT:2000}

# 检索上下文最大字符数
# Maximum context length from retrieved documents
app.rag-agent.rag.max-context-length=${RAG_MAX_CONTEXT_LENGTH:4000}

# 是否在回答中标注知识来源
# Whether to include source attribution in responses
app.rag-agent.rag.include-source-attribution=${RAG_INCLUDE_SOURCE:true}

# --- Agent (智能代理) 配置 ---
# Agent功能开关 (true=启用, false=禁用工具调用)
# Agent feature toggle (true=enabled, false=disable tool execution)
app.rag-agent.agent.enabled=${AGENT_ENABLED:true}

# 任务执行超时时间 (毫秒, 默认30秒)
# Task execution timeout in milliseconds (default 30 seconds)
app.rag-agent.agent.task-timeout-ms=${AGENT_TASK_TIMEOUT:30000}

# 工具执行失败最大重试次数
# Maximum retry attempts for failed tool execution
app.rag-agent.agent.max-retry-attempts=${AGENT_MAX_RETRY:2}

# 重试间隔时间 (毫秒)
# Delay between retry attempts in milliseconds
app.rag-agent.agent.retry-delay-ms=${AGENT_RETRY_DELAY:1000}

# 最大并行执行数
# Maximum number of parallel tool executions
app.rag-agent.agent.max-parallel-executions=${AGENT_MAX_PARALLEL:3}

# 敏感操作是否需要用户确认
# Whether to require user confirmation for sensitive operations
app.rag-agent.agent.require-confirmation=${AGENT_REQUIRE_CONFIRMATION:true}

# 任务计划最大步骤数
# Maximum number of steps in a task plan
app.rag-agent.agent.max-plan-steps=${AGENT_MAX_PLAN_STEPS:10}

# --- Elasticsearch 配置 (关键词检索) ---
# Elasticsearch server URL
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
# 连接超时 (毫秒)
spring.elasticsearch.connection-timeout=5s
# 读取超时 (毫秒)
spring.elasticsearch.socket-timeout=30s

# --- Neo4j 配置 (知识图谱, 可选) ---
# Neo4j server URL
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:silveragepass123}

# --- Chroma 向量数据库配置 ---
# Chroma服务器URL
# Chroma server URL
app.rag-agent.chroma.server-url=${CHROMA_SERVER_URL:http://localhost:8000}

# 知识库集合名称
# Collection name for health knowledge documents
app.rag-agent.chroma.collection-name=${CHROMA_COLLECTION_NAME:health_knowledge}

# 连接超时时间 (毫秒)
# Connection timeout in milliseconds
app.rag-agent.chroma.connection-timeout-ms=${CHROMA_CONNECTION_TIMEOUT:5000}

# 读取超时时间 (毫秒)
# Read timeout in milliseconds
app.rag-agent.chroma.read-timeout-ms=${CHROMA_READ_TIMEOUT:10000}

# 批量操作文档数量
# Maximum documents per batch operation
app.rag-agent.chroma.batch-size=${CHROMA_BATCH_SIZE:100}

# --- 嵌入模型配置 ---
# 嵌入模型提供商 (bge-m3, openai, local)
# Embedding model provider
app.rag-agent.embedding.provider=${EMBEDDING_PROVIDER:bge-m3}

# 嵌入模型名称
# Embedding model name
app.rag-agent.embedding.model-name=${EMBEDDING_MODEL_NAME:BAAI/bge-m3}

# 嵌入服务API地址
# Embedding API base URL
app.rag-agent.embedding.api-base-url=${EMBEDDING_API_URL:http://localhost:8001}

# 嵌入服务API密钥 (如需要)
# API key for embedding service (if required)
app.rag-agent.embedding.api-key=${EMBEDDING_API_KEY:}

# 嵌入向量维度 (bge-small-zh-v1.5=512, BGE-M3=1024)
# Embedding vector dimension (bge-small-zh-v1.5=512, BGE-M3=1024)
app.rag-agent.embedding.dimension=${EMBEDDING_DIMENSION:512}

# 批量嵌入生成大小
# Maximum batch size for embedding generation
app.rag-agent.embedding.batch-size=${EMBEDDING_BATCH_SIZE:32}

# 嵌入请求超时时间 (毫秒)
# Embedding request timeout in milliseconds
app.rag-agent.embedding.timeout-ms=${EMBEDDING_TIMEOUT:30000}

# --- 缓存配置 ---
# 启用嵌入缓存
# Enable embedding cache
app.rag-agent.cache.embedding-cache-enabled=${RAG_EMBEDDING_CACHE_ENABLED:true}

# 嵌入缓存过期时间 (秒, 默认1小时)
# Embedding cache TTL in seconds (default 1 hour)
app.rag-agent.cache.embedding-cache-ttl-seconds=${RAG_EMBEDDING_CACHE_TTL:3600}

# 嵌入缓存最大条目数
# Maximum number of cached embeddings
app.rag-agent.cache.embedding-cache-max-size=${RAG_EMBEDDING_CACHE_MAX_SIZE:1000}

# 启用检索结果缓存
# Enable retrieval result cache
app.rag-agent.cache.retrieval-cache-enabled=${RAG_RETRIEVAL_CACHE_ENABLED:true}

# 检索结果缓存过期时间 (秒, 默认5分钟)
# Retrieval cache TTL in seconds (default 5 minutes)
app.rag-agent.cache.retrieval-cache-ttl-seconds=${RAG_RETRIEVAL_CACHE_TTL:300}

# 检索结果缓存最大条目数
# Maximum number of cached retrieval results
app.rag-agent.cache.retrieval-cache-max-size=${RAG_RETRIEVAL_CACHE_MAX_SIZE:500}
