# ==========================================
# Development Profile Configuration
# ==========================================
# This profile is used for local development and testing.
# Use with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev

# ==========================================
# Development HTTPS Configuration
# ==========================================

# Enable SSL for development testing
server.ssl.enabled=true
server.ssl.port=8443

# Development keystore (self-signed certificate)
server.ssl.key-store=classpath:keystore/silveragepass.p12
server.ssl.key-store-password=devpassword
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=silveragepass

# TLS protocol versions
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# Strong cipher suites
server.ssl.ciphers=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

# Keep HTTP port for local testing (no redirect in dev)
server.port=8080
server.ssl.redirect-http-to-https=false

# ==========================================
# Development Database Configuration
# ==========================================

# Use local MySQL instance
spring.datasource.url=jdbc:mysql://localhost:3306/silveragepass_dev?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=adffqhjkk2020

# Show SQL for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Development Logging Configuration
# ==========================================

# More verbose logging for development
logging.level.root=INFO
logging.level.com.learning.silveragepass=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Log SSL/TLS handshake details
logging.level.javax.net.ssl=DEBUG

# ==========================================
# Development CORS Configuration
# ==========================================

# Allow all origins for local development
spring.webmvc.cors.allowed-origins=*
spring.webmvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.webmvc.cors.allowed-headers=*
spring.webmvc.cors.allow-credentials=true

# ==========================================
# Development API Keys (Test Keys)
# ==========================================

# Use test API keys for development
app.api-keys.amap.key=6be6ab2b815017316edb45495a29b8b2
app.api-keys.qweather.key=0658123053834954956b7515b0cea0a2

# ==========================================
# Development Spring AI Configuration
# ==========================================

# Use test API key or mock service
spring.ai.openai.api-key=${SILICONFLOW_API_KEY:test-api-key}
spring.ai.openai.base-url=${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}

# ==========================================
# Development File Storage
# ==========================================

# Use local directory for file uploads
file.storage.upload-dir=./uploads-dev

# ==========================================
# Development Notes
# ==========================================

# To run with this profile:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# Application will be available at:
#   HTTP:  http://localhost:8080/silveragepass
#   HTTPS: https://localhost:8443/silveragepass
#
# For HTTPS testing:
#   1. Generate certificate: ./generate-dev-certificate.sh (or .bat on Windows)
#   2. Configure Android app to trust self-signed certificates
#   3. See TLS_HTTPS_CONFIGURATION_GUIDE.md for details
